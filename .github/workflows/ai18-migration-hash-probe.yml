name: AI18 Migration Hash Probe

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260807173000_tiger_sovereign_owner_stepup_authorization.sql'
      - '.github/workflows/ai18-migration-hash-probe.yml'

permissions:
  contents: read

jobs:
  hash-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit exact migration review evidence
        shell: bash
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260807173000_tiger_sovereign_owner_stepup_authorization.sql'
          hash="$(sha256sum "$migration" | awk '{print $1}')"

          set +e
          output="$(bash scripts/security/p08-steel-shield/scan-dangerous-sql.sh 2>&1)"
          scanner_rc=$?
          set -e

          relevant="$(printf '%s\n' "$output" | grep -F "$migration" || true)"
          critical="$(printf '%s\n' "$relevant" | grep -c '^CRITICAL:' || true)"
          not_null="$(printf '%s\n' "$relevant" | grep -c '^HIGH:NOT_NULL_RISK:' || true)"
          update_without_where="$(printf '%s\n' "$relevant" | grep -c '^HIGH:UPDATE_WITHOUT_WHERE:' || true)"
          all_high="$(printf '%s\n' "$relevant" | grep -c '^HIGH:' || true)"
          other_high=$((all_high - not_null - update_without_where))

          echo "::error title=AI18_MIGRATION_SHA256::$hash"
          echo "::error title=AI18_STEEL_SHIELD_COUNTS::CRITICAL=$critical NOT_NULL_RISK=$not_null UPDATE_WITHOUT_WHERE=$update_without_where OTHER_HIGH=$other_high SCANNER_RC=$scanner_rc"
          exit 1
