name: TIGER Media Finalizer Sovereign Sealed Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected main commit SHA eligible for the Seoul sealed build
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  AWS_REGION: ${{ vars.TIGER_AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.TIGER_MEDIA_ECR_REPOSITORY }}
  BUILD_ROLE_ARN: ${{ vars.TIGER_MEDIA_BUILD_ROLE_ARN }}
  BASE_IMAGE_REF: public.ecr.aws/lambda/nodejs:24@sha256:f3c848893566f5efb8bf8c48798f0687a7196cf1808846cafbb4974706be3cdc
  SYFT_LINUX_AMD64_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
  CYCLONEDX_CLI_VERSION: '0.30.0'
  CYCLONEDX_LINUX_X64_SHA256: f89876326620f5fc78a9b27cc1af57d6ed13d019aab87490e1246a44a910babb

jobs:
  sealed-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: media-build
    steps:
      - name: Validate sealed-build authority inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$AWS_REGION" = "ap-northeast-2"
          test "$ECR_REPOSITORY" = "tiger-media-finalizer"
          test "$BUILD_ROLE_ARN" = "arn:aws:iam::211579682376:role/TIGER-VVIP-GitHub-MediaBuild"

      - name: Checkout exact protected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/media-finalizer/package-lock.json

      - name: Verify exact current main and immutable source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Capture authoritative source material digests
        id: materials
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n 1 services/media-finalizer/Dockerfile)" = "FROM $BASE_IMAGE_REF"
          echo "base_digest=${BASE_IMAGE_REF##*@}" >> "$GITHUB_OUTPUT"
          echo "dockerfile_sha=$(sha256sum services/media-finalizer/Dockerfile | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "lock_sha=$(sha256sum services/media-finalizer/package-lock.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "foundation_template_sha=$(sha256sum infra/media-finalizer/foundation/template.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "foundation_guard_sha=$(sha256sum infra/media-finalizer/foundation/guard.guard | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "regional_template_sha=$(sha256sum infra/media-finalizer/regional/template.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "regional_guard_sha=$(sha256sum infra/media-finalizer/regional/guard.guard | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "edge_template_sha=$(sha256sum infra/media-finalizer/edge/template.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "edge_guard_sha=$(sha256sum infra/media-finalizer/edge/guard.guard | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "db_media_sha=$(sha256sum supabase/migrations/20260816090001_sovereign_media_finalization.sql | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "db_proof_sha=$(sha256sum supabase/migrations/20260826120000_synapse_proof_of_now.sql | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "db_identity_sha=$(sha256sum supabase/migrations/20260827120000_sealed_media_identity_binding.sql | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Run Node 24 security and contract gate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix services/media-finalizer ci --omit=dev --ignore-scripts=false --no-audit --no-fund
          npm --prefix services/media-finalizer audit --omit=dev --audit-level=high
          node --test tests/media-finalizer-*.test.cjs tests/fusion-server-media-finalization-contract.test.cjs tests/tiger-synapse-proof-capture-origin.test.cjs tests/tiger-sovereign-constellation-infrastructure.test.cjs

      - name: Install checksum-pinned SBOM toolchain
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/tiger-sealed-tools"
          mkdir -p "$tool_dir"

          syft_archive="$RUNNER_TEMP/syft_1.51.0_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz" \
            --output "$syft_archive"
          echo "$SYFT_LINUX_AMD64_SHA256  $syft_archive" | sha256sum --check --strict
          tar -xzf "$syft_archive" -C "$tool_dir" syft
          chmod 0755 "$tool_dir/syft"
          "$tool_dir/syft" version

          cyclonedx_bin="$RUNNER_TEMP/cyclonedx-linux-x64"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64" \
            --output "$cyclonedx_bin"
          echo "$CYCLONEDX_LINUX_X64_SHA256  $cyclonedx_bin" | sha256sum --check --strict
          install -m 0755 "$cyclonedx_bin" "$tool_dir/cyclonedx"
          "$tool_dir/cyclonedx" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Configure AWS through exact GitHub OIDC identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '211579682376'
          role-session-name: tiger-media-sealed-${{ github.run_id }}
          unset-current-credentials: true

      - name: Resolve and prove Seoul ECR build authority
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/media-cell
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "211579682376"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --output json > "$RUNNER_TEMP/repository.json"
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/repository.json', 'utf8'));
          const repo = x.repositories?.[0];
          if (!repo) throw new Error('SEALED_ECR_REPOSITORY_MISSING');
          if (repo.repositoryName !== process.env.ECR_REPOSITORY) throw new Error('SEALED_ECR_REPOSITORY_MISMATCH');
          if (repo.imageTagMutability !== 'IMMUTABLE') throw new Error('SEALED_ECR_TAG_MUTABILITY_INVALID');
          if (repo.encryptionConfiguration?.encryptionType !== 'KMS') throw new Error('SEALED_ECR_ENCRYPTION_INVALID');
          NODE
          repository_uri="$(node -p "require(process.env.RUNNER_TEMP + '/repository.json').repositories[0].repositoryUri")"
          test "$repository_uri" = "$registry/$ECR_REPOSITORY"

          aws ecr get-registry-scanning-configuration --output json > "$RUNNER_TEMP/registry-scanning.json"
          node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/registry-scanning.json', 'utf8'));
          const cfg = input.scanningConfiguration;
          if (cfg?.scanType !== 'ENHANCED') throw new Error('SEALED_ECR_SCAN_TYPE_NOT_ENHANCED');
          const repository = process.env.ECR_REPOSITORY;
          const rules = Array.isArray(cfg.rules) ? cfg.rules : [];
          const escapeRegex = (v) => v.replace(/[.+?^${}()|[\]\\]/g, '\\$&');
          const filterMatches = (filter) => {
            if (typeof filter !== 'string' || filter.length === 0) return false;
            if (!filter.includes('*')) return repository.includes(filter);
            return new RegExp('^' + filter.split('*').map(escapeRegex).join('.*') + '$').test(repository);
          };
          let matchedFilter = rules.length === 0 ? '<default-all-repositories>' : null;
          for (const rule of rules) {
            if (rule.scanFrequency !== 'CONTINUOUS_SCAN') continue;
            for (const filter of rule.repositoryFilters || []) {
              if (filter.filterType === 'WILDCARD' && filterMatches(filter.filter)) {
                matchedFilter = filter.filter;
                break;
              }
            }
            if (matchedFilter) break;
          }
          if (!matchedFilter) throw new Error('SEALED_ECR_CONTINUOUS_SCAN_NOT_COVERED');
          fs.writeFileSync(
            'artifacts/media-cell/registry-scanning-authority.json',
            JSON.stringify({ scanType: 'ENHANCED', frequency: 'CONTINUOUS_SCAN', repository, matchedFilter }) + '\n',
            { mode: 0o600 },
          );
          NODE

          if existing="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$SOURCE_SHA" --output json 2>&1)"; then
            echo "::error title=SEALED_IMAGE_ALREADY_EXISTS::Immutable source tag already exists; refusing to rebuild the same release."
            exit 1
          fi
          if ! grep -q 'ImageNotFoundException' <<< "$existing"; then
            printf '%s\n' "$existing" >&2
            exit 1
          fi

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          echo "repository_uri=$repository_uri" >> "$GITHUB_OUTPUT"

      - name: Build once and push one immutable candidate
        id: image
        shell: bash
        env:
          REPOSITORY_URI: ${{ steps.ecr.outputs.repository_uri }}
        run: |
          set -euo pipefail
          remote_ref="$REPOSITORY_URI:$SOURCE_SHA"
          docker build --pull=false --tag "$remote_ref" services/media-finalizer
          docker push "$remote_ref"
          image_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$SOURCE_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Wait for Inspector findings and enforce CRITICAL HIGH zero gate
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          image_digest="${{ steps.image.outputs.image_digest }}"
          ready=false
          for attempt in $(seq 1 90); do
            if aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$image_digest" \
              --no-paginate \
              --query '{status:imageScanStatus.status,completedAt:imageScanFindings.imageScanCompletedAt,severityCounts:imageScanFindings.findingSeverityCounts}' \
              --output json > "$RUNNER_TEMP/scan-attempt.json" 2> "$RUNNER_TEMP/scan-attempt.err"; then
              status="$(node -p "require(process.env.RUNNER_TEMP + '/scan-attempt.json').status || ''")"
              completed_at="$(node -p "String(require(process.env.RUNNER_TEMP + '/scan-attempt.json').completedAt ?? '')")"
              case "$status" in
                COMPLETE|ACTIVE)
                  if [[ -n "$completed_at" && "$completed_at" != "null" ]]; then ready=true; break; fi
                  ;;
                FAILED|UNSUPPORTED_IMAGE|SCAN_ELIGIBILITY_EXPIRED|FINDINGS_UNAVAILABLE|LIMIT_EXCEEDED|IMAGE_ARCHIVED)
                  cat "$RUNNER_TEMP/scan-attempt.json" >&2
                  exit 1
                  ;;
                IN_PROGRESS|PENDING|'') ;;
                *) echo "Unexpected ECR scan status: $status" >&2; exit 1 ;;
              esac
            elif ! grep -Eq 'ScanNotFoundException|ImageNotFoundException' "$RUNNER_TEMP/scan-attempt.err"; then
              cat "$RUNNER_TEMP/scan-attempt.err" >&2
              exit 1
            fi
            sleep 10
          done
          test "$ready" = true
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/scan-attempt.json', 'utf8'));
          const c = x.severityCounts || {};
          const summary = {
            status: x.status,
            completedAt: x.completedAt,
            scanType: 'ENHANCED',
            frequency: 'CONTINUOUS_SCAN',
            critical: Number(c.CRITICAL || 0),
            high: Number(c.HIGH || 0),
            medium: Number(c.MEDIUM || 0),
            low: Number(c.LOW || 0),
          };
          if (!Number.isSafeInteger(summary.critical) || !Number.isSafeInteger(summary.high)) throw new Error('SEALED_ECR_SCAN_COUNTS_INVALID');
          if (summary.critical !== 0 || summary.high !== 0) throw new Error('SEALED_ECR_VULNERABILITY_GATE_REJECTED');
          fs.writeFileSync('artifacts/media-cell/scan-summary.json', JSON.stringify(summary) + '\n', { mode: 0o600 });
          NODE

      - name: Generate real OCI inventory and validate CycloneDX 1.7
        id: sbom
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail
          syft "$IMAGE_REPOSITORY@$IMAGE_DIGEST" -o cyclonedx-json@1.6 > "$RUNNER_TEMP/container-sbom-1.6.json"
          cyclonedx convert \
            --input-file "$RUNNER_TEMP/container-sbom-1.6.json" \
            --input-format json \
            --output-file artifacts/media-cell/container-sbom.cdx.json \
            --output-format json \
            --output-version v1_7
          cyclonedx validate \
            --input-file artifacts/media-cell/container-sbom.cdx.json \
            --input-format json \
            --input-version v1_7 \
            --fail-on-errors
          node scripts/release/media-cell-sbom-verify.cjs artifacts/media-cell/container-sbom.cdx.json artifacts/media-cell/container-sbom-summary.json
          sbom_sha="$(sha256sum artifacts/media-cell/container-sbom.cdx.json | awk '{print $1}')"
          [[ "$sbom_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "sbom_sha=$sbom_sha" >> "$GITHUB_OUTPUT"

      - name: Generate build-materials evidence bound to the OCI digest
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          BASE_DIGEST: ${{ steps.materials.outputs.base_digest }}
          DOCKERFILE_SHA: ${{ steps.materials.outputs.dockerfile_sha }}
          LOCK_SHA: ${{ steps.materials.outputs.lock_sha }}
          FOUNDATION_TEMPLATE_SHA: ${{ steps.materials.outputs.foundation_template_sha }}
          FOUNDATION_GUARD_SHA: ${{ steps.materials.outputs.foundation_guard_sha }}
          REGIONAL_TEMPLATE_SHA: ${{ steps.materials.outputs.regional_template_sha }}
          REGIONAL_GUARD_SHA: ${{ steps.materials.outputs.regional_guard_sha }}
          EDGE_TEMPLATE_SHA: ${{ steps.materials.outputs.edge_template_sha }}
          EDGE_GUARD_SHA: ${{ steps.materials.outputs.edge_guard_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            source: { commitSha: process.env.SOURCE_SHA, treeSha: process.env.SOURCE_TREE, immutable: true },
            materials: {
              'services/media-finalizer/Dockerfile': process.env.DOCKERFILE_SHA,
              'services/media-finalizer/package-lock.json': process.env.LOCK_SHA,
              'infra/media-finalizer/foundation/template.yaml': process.env.FOUNDATION_TEMPLATE_SHA,
              'infra/media-finalizer/foundation/guard.guard': process.env.FOUNDATION_GUARD_SHA,
              'infra/media-finalizer/regional/template.yaml': process.env.REGIONAL_TEMPLATE_SHA,
              'infra/media-finalizer/regional/guard.guard': process.env.REGIONAL_GUARD_SHA,
              'infra/media-finalizer/edge/template.yaml': process.env.EDGE_TEMPLATE_SHA,
              'infra/media-finalizer/edge/guard.guard': process.env.EDGE_GUARD_SHA,
            },
            image: { repository: process.env.IMAGE_REPOSITORY, manifestDigest: process.env.IMAGE_DIGEST, baseDigest: process.env.BASE_DIGEST },
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/materials-input.json', JSON.stringify(evidence));
          NODE
          node scripts/release/media-cell-sbom.cjs "$RUNNER_TEMP/materials-input.json" artifacts/media-cell/materials.cdx.json

      - name: Attest exact OCI provenance
        id: attest_provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.image.outputs.repository_uri }}
          subject-digest: ${{ steps.image.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: Attest exact OCI CycloneDX SBOM
        id: attest_sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ${{ steps.image.outputs.repository_uri }}
          subject-digest: ${{ steps.image.outputs.image_digest }}
          sbom-path: artifacts/media-cell/container-sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: Verify provenance and SBOM attestations against exact workflow identity
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -euo pipefail
          signer_workflow="github.com/$GITHUB_REPOSITORY/.github/workflows/media-finalizer-build.yml"
          gh attestation verify "oci://$IMAGE_REPOSITORY@$IMAGE_DIGEST" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" --source-ref refs/heads/main \
            --format json > artifacts/media-cell/provenance-verification.json
          gh attestation verify "oci://$IMAGE_REPOSITORY@$IMAGE_DIGEST" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" --source-ref refs/heads/main \
            --predicate-type https://cyclonedx.org/bom --format json > artifacts/media-cell/sbom-verification.json
          node -e "for (const f of ['provenance-verification.json','sbom-verification.json']) { const x=require('./artifacts/media-cell/'+f); if (!Array.isArray(x) || x.length < 1) process.exit(1); }"
          echo "provenance_sha=$(sha256sum artifacts/media-cell/provenance-verification.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sbom_attestation_sha=$(sha256sum artifacts/media-cell/sbom-verification.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create TIGER Cryptographic Genome
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          BASE_DIGEST: ${{ steps.materials.outputs.base_digest }}
          DOCKERFILE_SHA: ${{ steps.materials.outputs.dockerfile_sha }}
          LOCK_SHA: ${{ steps.materials.outputs.lock_sha }}
          FOUNDATION_TEMPLATE_SHA: ${{ steps.materials.outputs.foundation_template_sha }}
          FOUNDATION_GUARD_SHA: ${{ steps.materials.outputs.foundation_guard_sha }}
          REGIONAL_TEMPLATE_SHA: ${{ steps.materials.outputs.regional_template_sha }}
          REGIONAL_GUARD_SHA: ${{ steps.materials.outputs.regional_guard_sha }}
          EDGE_TEMPLATE_SHA: ${{ steps.materials.outputs.edge_template_sha }}
          EDGE_GUARD_SHA: ${{ steps.materials.outputs.edge_guard_sha }}
          DB_MEDIA_SHA: ${{ steps.materials.outputs.db_media_sha }}
          DB_PROOF_SHA: ${{ steps.materials.outputs.db_proof_sha }}
          DB_IDENTITY_SHA: ${{ steps.materials.outputs.db_identity_sha }}
          CONTAINER_SBOM_SHA: ${{ steps.sbom.outputs.sbom_sha }}
          PROVENANCE_ATTESTATION_ID: ${{ steps.attest_provenance.outputs.attestation-id }}
          SBOM_ATTESTATION_ID: ${{ steps.attest_sbom.outputs.attestation-id }}
          PROVENANCE_EVIDENCE_SHA: ${{ steps.verify.outputs.provenance_sha }}
          SBOM_ATTESTATION_EVIDENCE_SHA: ${{ steps.verify.outputs.sbom_attestation_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const s = JSON.parse(fs.readFileSync('artifacts/media-cell/container-sbom-summary.json', 'utf8'));
          const evidence = {
            source: { commitSha: process.env.SOURCE_SHA, treeSha: process.env.SOURCE_TREE, immutable: true },
            image: { repository: process.env.IMAGE_REPOSITORY, manifestDigest: process.env.IMAGE_DIGEST, baseDigest: process.env.BASE_DIGEST },
            materials: {
              'services/media-finalizer/Dockerfile': process.env.DOCKERFILE_SHA,
              'services/media-finalizer/package-lock.json': process.env.LOCK_SHA,
              'infra/media-finalizer/foundation/template.yaml': process.env.FOUNDATION_TEMPLATE_SHA,
              'infra/media-finalizer/foundation/guard.guard': process.env.FOUNDATION_GUARD_SHA,
              'infra/media-finalizer/regional/template.yaml': process.env.REGIONAL_TEMPLATE_SHA,
              'infra/media-finalizer/regional/guard.guard': process.env.REGIONAL_GUARD_SHA,
              'infra/media-finalizer/edge/template.yaml': process.env.EDGE_TEMPLATE_SHA,
              'infra/media-finalizer/edge/guard.guard': process.env.EDGE_GUARD_SHA,
            },
            dbMigrations: {
              'supabase/migrations/20260816090001_sovereign_media_finalization.sql': process.env.DB_MEDIA_SHA,
              'supabase/migrations/20260826120000_synapse_proof_of_now.sql': process.env.DB_PROOF_SHA,
              'supabase/migrations/20260827120000_sealed_media_identity_binding.sql': process.env.DB_IDENTITY_SHA,
            },
            containerSbom: { specVersion: '1.7', sha256: process.env.CONTAINER_SBOM_SHA, componentCount: s.componentCount, npmPackages: s.npmPackages, osPackages: s.osPackages },
            attestations: {
              provenance: { attestationId: process.env.PROVENANCE_ATTESTATION_ID, verified: true, evidenceSha256: process.env.PROVENANCE_EVIDENCE_SHA },
              sbom: { attestationId: process.env.SBOM_ATTESTATION_ID, verified: true, evidenceSha256: process.env.SBOM_ATTESTATION_EVIDENCE_SHA },
            },
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/genome-input.json', JSON.stringify(evidence));
          NODE
          node scripts/release/media-cell-genome.cjs "$RUNNER_TEMP/genome-input.json" artifacts/media-cell/cryptographic-genome.json
          node -e "const x=require('./artifacts/media-cell/cryptographic-genome.json'); if(!/^sha256:[0-9a-f]{64}$/.test(x.genomeId)) process.exit(1)"

      - name: Create Release Passport v2 only from verified Genome and scan evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const genome = JSON.parse(fs.readFileSync('artifacts/media-cell/cryptographic-genome.json', 'utf8'));
          const scan = JSON.parse(fs.readFileSync('artifacts/media-cell/scan-summary.json', 'utf8'));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/passport-input.json', JSON.stringify({
            genome,
            vulnerabilityGate: { scanType: 'ENHANCED', frequency: 'CONTINUOUS_SCAN', critical: scan.critical, high: scan.high },
          }));
          NODE
          node scripts/release/media-cell-passport.cjs "$RUNNER_TEMP/passport-input.json" artifacts/media-cell/release-passport.json
          node -e "const x=require('./artifacts/media-cell/release-passport.json'); if(x.schemaVersion!=='tiger-release-passport-v2') process.exit(1)"

      - name: Verify protected source remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload bounded sealed-build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tiger-sovereign-media-${{ env.SOURCE_SHA }}
          path: artifacts/media-cell
          if-no-files-found: error
          retention-days: 30
