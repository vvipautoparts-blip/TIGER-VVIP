name: Mobile Lockfile Evidence

on:
  push:
    branches:
      - feat/mobile-native-launch-foundation-20260808
    paths:
      - "mobile/package.json"
      - ".github/workflows/mobile-lockfile-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Generate package lock without lifecycle scripts
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Verify exact dependency graph and reviewed lock digest
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="c9a782347f8a4d1dea3015b3ca8c15ce4b2762aff4494eb282820555203d55dd"
          test "$actual" = "$expected" || {
            echo "MOBILE_LOCK_DIGEST_MISMATCH:expected=$expected actual=$actual" >&2
            exit 1
          }
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const expected = ['@capacitor/android','@capacitor/core','@capacitor/ios','@capacitor/cli'];
          for (const name of expected) {
            const entry = lock.packages?.[`node_modules/${name}`];
            if (!entry || entry.version !== '8.4.2') {
              console.error(`MOBILE_LOCK_VERSION_MISMATCH:${name}:${entry?.version || 'missing'}`);
              process.exit(1);
            }
          }
          console.log('MOBILE_LOCK_DEPENDENCIES=PASS');
          NODE

      - name: Emit lock digest
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          sha256sum package-lock.json | tee "$RUNNER_TEMP/mobile-package-lock.sha256"

      - name: Persist exact reviewed package lock on the source branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'MOBILE_LOCK_SOURCE_ALREADY_FROZEN=YES'
            exit 0
          fi
          git commit -m 'build(mobile): freeze verified Capacitor dependency lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'MOBILE_LOCK_SOURCE_PERSISTED=YES'

      - name: Upload lockfile evidence
        uses: actions/upload-artifact@v6
        with:
          name: mobile-package-lock-${{ github.sha }}
          path: |
            mobile/package-lock.json
            ${{ runner.temp }}/mobile-package-lock.sha256
          if-no-files-found: error
          retention-days: 14
