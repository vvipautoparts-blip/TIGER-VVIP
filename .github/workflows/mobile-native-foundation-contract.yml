name: Mobile Native Foundation Contract

on:
  push:
    branches:
      - feat/mobile-native-launch-foundation-20260808
  pull_request:
    paths:
      - "mobile/**"
      - "tests/mobile-*.test.cjs"
      - ".gitignore"
      - ".github/workflows/mobile-native-foundation-contract.yml"
      - ".github/workflows/tsrf-staging-evidence.yml"
      - ".github/workflows/mobile-android-rehearsal.yml"
      - ".github/workflows/mobile-ios-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run all mobile engineering contracts
        run: node --test tests/mobile-*.test.cjs

      - name: Verify source remains clean
        run: test -z "$(git status --porcelain=v1 -uall)"
