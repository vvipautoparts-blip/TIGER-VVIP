name: TIGER CleanGuard

on:
  pull_request:
    branches:
      - main
      - integration/v14-global-launch-readiness-20260806
  push:
    branches:
      - integration/v14-global-launch-readiness-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanguard-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Run CleanGuard contract tests
        run: |
          node --test \
            tests/value-governance-cli.test.cjs \
            tests/value-governance-contracts.test.cjs \
            tests/value-governance-evaluator.test.cjs \
            tests/value-governance-inventory.test.cjs \
            tests/value-governance-planner.test.cjs \
            tests/value-governance-registry.test.cjs

      - name: Run fail-closed repository analysis
        run: node project-control/value-governance/cli.mjs --check
