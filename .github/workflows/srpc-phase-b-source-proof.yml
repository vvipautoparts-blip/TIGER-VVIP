name: SRPC Phase B Source Proof

on:
  push:
    branches:
      - feat/srpc-v1-control-plane-20260809
    paths:
      - .github/workflows/srpc-phase-b-source-proof.yml
      - tools/srpc/constants.py
      - tools/srpc/source_lock.py
      - tests/test_srpc_source_lock.py
      - tests/srpc-workflow-contracts.test.cjs

permissions:
  contents: read

jobs:
  source-proof:
    name: Exact H0 source and Phase B static proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact control-plane commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1

      - name: Verify control-plane source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C control rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/control-plane-sha.txt"

      - name: Checkout frozen Phase B H0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e4124031d68dba24faea7c0ed7e6c8ef1e09a4d0
          path: source
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Verify frozen commit and exact migration bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          python control/tools/srpc/source_lock.py \
            --source-root "$GITHUB_WORKSPACE/source" \
            --actual-commit "$actual" \
            --output "$RUNNER_TEMP/source-lock.json"

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Run exact Phase B static contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test source/tests/global-launch-phase-b-marketplace-convergence.test.cjs \
            | tee "$RUNNER_TEMP/phase-b-static.log"
          grep -F \
            'GLOBAL_LAUNCH_PHASE_B_SHA256=9dd28d7c02c7b1a37da59b0ac8fe28df73f656d9f9a16dcd356989cc3520a8b9' \
            "$RUNNER_TEMP/phase-b-static.log"

      - name: Upload exact source proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: srpc-phase-b-source-proof-e4124031d68dba24faea7c0ed7e6c8ef1e09a4d0
          path: |
            ${{ runner.temp }}/control-plane-sha.txt
            ${{ runner.temp }}/source-lock.json
            ${{ runner.temp }}/phase-b-static.log
          if-no-files-found: error
          retention-days: 30
