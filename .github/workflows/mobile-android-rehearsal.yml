name: Mobile Android Rehearsal

on:
  push:
    branches:
      - feat/mobile-native-launch-foundation-20260808
  pull_request:
    paths:
      - "mobile/**"
      - "tools/vvip_public_release.py"
      - "tests/mobile-*.test.cjs"
      - ".github/workflows/mobile-android-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  EXPECTED_MOBILE_LOCK_SHA256: c9a782347f8a4d1dea3015b3ca8c15ce4b2762aff4494eb282820555203d55dd

jobs:
  android-engineering-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and verify Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root" || {
            echo 'MOBILE_ANDROID_SDK_ROOT_MISSING' >&2
            exit 1
          }
          test -d "$sdk_root" || {
            echo "MOBILE_ANDROID_SDK_ROOT_INVALID:$sdk_root" >&2
            exit 1
          }

          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 -print 2>/dev/null | sort -r | head -n 1)"
          fi
          test -n "$sdkmanager" && test -x "$sdkmanager" || {
            echo "MOBILE_ANDROID_SDKMANAGER_MISSING:$sdk_root" >&2
            exit 1
          }
          echo "MOBILE_ANDROID_SDKMANAGER=$sdkmanager"

          "$sdkmanager" --licenses < <(yes) >/dev/null
          "$sdkmanager" "platforms;android-36"
          test -d "$sdk_root/platforms/android-36" || {
            echo 'MOBILE_ANDROID_API36_MISSING_AFTER_INSTALL' >&2
            exit 1
          }
          echo 'MOBILE_ANDROID_API36=PASS'

      - name: Verify frozen mobile dependency lock
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$actual" = "$EXPECTED_MOBILE_LOCK_SHA256" || {
            echo "MOBILE_LOCK_DIGEST_MISMATCH:expected=$EXPECTED_MOBILE_LOCK_SHA256 actual=$actual" >&2
            exit 1
          }
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0

      - name: Build exact eligible Web candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/vvip_public_release.py \
            --source . \
            --output dist/public \
            --mode candidate \
            --source-sha "$SOURCE_SHA"
          python - <<'PY'
          import json, os
          manifest = json.load(open('dist/public/release-manifest.json', encoding='utf-8'))
          assert manifest['releaseEligible'] is True, manifest
          assert manifest['sourceSha'] == os.environ['SOURCE_SHA'], manifest
          print('MOBILE_ANDROID_WEB_ARTIFACT=PASS')
          PY

      - name: Prepare exact Web artifact for native shell
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA" node mobile/scripts/prepare-web.mjs

      - name: Generate Android native shell
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run native:android

      - name: Assert Android native security boundary and API floor
        shell: bash
        run: |
          set -euo pipefail
          node mobile/scripts/assert-native-security.mjs android
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' mobile/android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' mobile/android/variables.gradle
          grep -Fq 'android:usesCleartextTraffic="false"' mobile/android/app/src/main/AndroidManifest.xml
          echo 'MOBILE_ANDROID_NATIVE_CONTRACT=PASS'

      - name: Run real Android Gradle verification
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Emit exact-head Android engineering evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-android-evidence"
          apk="$(find mobile/android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" "$RUNNER_TEMP/mobile-android-evidence/vvip-tiger-debug.apk"
          sha256sum "$RUNNER_TEMP/mobile-android-evidence/vvip-tiger-debug.apk" > "$RUNNER_TEMP/mobile-android-evidence/apk.sha256"
          sha256sum mobile/package-lock.json > "$RUNNER_TEMP/mobile-android-evidence/package-lock.sha256"
          cat > "$RUNNER_TEMP/mobile-android-evidence/source.txt" <<EOF
          SOURCE_SHA=$SOURCE_SHA
          APP_ID=com.vviptiger.app
          COMPILE_SDK=36
          TARGET_SDK=36
          SIGNED_FOR_PLAY=NO
          PLAY_UPLOAD_EXECUTED=NO
          EOF
          test -z "$(git status --porcelain=v1 -uall)"

      - name: Upload Android debug build evidence
        uses: actions/upload-artifact@v6
        with:
          name: mobile-android-debug-${{ github.sha }}
          path: ${{ runner.temp }}/mobile-android-evidence
          if-no-files-found: error
          retention-days: 14
