name: TSRF Sovereign Phone OTP Rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/phone-verification/index.ts"
      - "supabase/migrations/20260808133000_phone_otp_challenges.sql"
      - "tests/tsrf-phone-otp-contract.test.cjs"
      - "tests/sql/tsrf-phone-otp-behavior.sql"
      - "scripts/security/p08-steel-shield/scan-dangerous-sql.sh"
      - ".github/workflows/tsrf-phone-otp-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsrf-phone-otp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          echo "OTP_SOURCE_SHA=$actual_sha"
      - name: Run sovereign OTP contract
        run: node --test tests/tsrf-phone-otp-contract.test.cjs
      - name: Bind migration digest
        id: digest
        shell: bash
        run: |
          set -Eeuo pipefail
          hash="$(sha256sum supabase/migrations/20260808133000_phone_otp_challenges.sql | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s\n' "$hash" > /tmp/otp-migration-sha256.txt
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "OTP_MIGRATION_SHA256=$hash"
      - name: Upload digest evidence
        uses: actions/upload-artifact@v6
        with:
          name: otp-migration-${{ steps.digest.outputs.sha256 }}
          path: /tmp/otp-migration-sha256.txt
          if-no-files-found: error
          retention-days: 14

  edge-typecheck:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck phone verification edge function
        run: deno check supabase/functions/phone-verification/index.ts

  local-db-behavior:
    needs:
      - contract
      - edge-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Assert local-only safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if env | grep -E '^(SUPABASE_ACCESS_TOKEN|SUPABASE_DB_PASSWORD|SUPABASE_PROJECT_REF)=' >/dev/null; then
            echo 'OTP_REHEARSAL=BLOCKED_REMOTE_CREDENTIAL_ENV'
            exit 1
          fi
          echo 'OTP_LOCAL_ONLY_CONTRACT=PASS'
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Rebuild database from repository migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          supabase db reset --local
          echo 'OTP_LOCAL_DB_RESET=PASS'
      - name: Execute sovereign OTP behavior proof
        shell: bash
        run: |
          set -Eeuo pipefail
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/tsrf-phone-otp-behavior.sql
          echo 'OTP_BEHAVIOR_PROOF=PASS'
      - name: Stop isolated local stack
        if: always()
        run: supabase stop --no-backup || true
