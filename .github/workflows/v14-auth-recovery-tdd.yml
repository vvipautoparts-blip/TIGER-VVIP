name: V14 Auth Recovery TDD

on:
  push:
    branches:
      - integration/v14-global-launch-readiness-20260806
    paths:
      - .github/workflows/v14-auth-recovery-tdd.yml
      - auth-clerk-index.js
      - tests/auth-clerk-index.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-auth-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Run focused auth recovery contract
        run: node --test tests/auth-clerk-index.test.cjs
