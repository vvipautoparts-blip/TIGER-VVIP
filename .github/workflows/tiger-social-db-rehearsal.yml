      - ".github/workflows/tiger-social-db-rehearsal.yml"
  pull_request:
    paths:
      - "supabase/migrations/20260818125000_social_core_foundation.sql"
      - "supabase/migrations/20260818133000_social_reactions.sql"
      - "supabase/migrations/20260818143000_social_comments.sql"
