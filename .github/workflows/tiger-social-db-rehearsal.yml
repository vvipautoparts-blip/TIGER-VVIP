            exit 1
          fi

      - name: Prove SYNAPSE S4 Proof-of-Now concurrent single-use behavior
        shell: bash
        run: |
          set -euo pipefail

          race_a="$(mktemp)"
          race_b="$(mktemp)"
          blocker_log="$(mktemp)"
          trap 'rm -f "$race_a" "$race_b" "$blocker_log"' EXIT

          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/tiger-synapse-proof-of-now-concurrency-setup.sql

          (
            PGOPTIONS='-c statement_timeout=15000' PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -p 54322 \
              -U postgres \
              -d postgres \
              -v ON_ERROR_STOP=1 <<'SQL'
\set ON_ERROR_STOP on
begin;
select 1
from public.vvip_synapse_proof_challenges
where challenge_id = '55555555-5555-4555-8555-555555555551'::uuid
for update;
select pg_advisory_lock(8675309);
select pg_sleep(3);
select pg_advisory_unlock(8675309);
commit;
SQL
          ) >"$blocker_log" 2>&1 &
          blocker_pid=$!

          blocker_ready=0
          for _attempt in $(seq 1 50); do
            state="$(PGPASSWORD=postgres psql -qAt \
              -h 127.0.0.1 \
              -p 54322 \
              -U postgres \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "select case when pg_try_advisory_lock(8675309) then 'FREE' else 'HELD' end")"
            if [[ "$state" == "HELD" ]]; then
              blocker_ready=1
              break
            fi
            sleep 0.1
          done

          if [[ "$blocker_ready" -ne 1 ]]; then
            echo 'PROOF_CONCURRENT_BARRIER_READY=FAIL'
            cat "$blocker_log"
            kill "$blocker_pid" 2>/dev/null || true
            exit 1
          fi
          echo 'PROOF_CONCURRENT_BARRIER_READY=PASS'

          PGOPTIONS='-c statement_timeout=15000 -c lock_timeout=10000' PGPASSWORD=postgres psql -qAt \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/sql/tiger-synapse-proof-of-now-concurrency-consume.sql >"$race_a" 2>&1 &
          race_a_pid=$!

          PGOPTIONS='-c statement_timeout=15000 -c lock_timeout=10000' PGPASSWORD=postgres psql -qAt \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/sql/tiger-synapse-proof-of-now-concurrency-consume.sql >"$race_b" 2>&1 &
          race_b_pid=$!

          set +e
          wait "$race_a_pid"; race_a_exit=$?
          wait "$race_b_pid"; race_b_exit=$?
          wait "$blocker_pid"; blocker_exit=$?
          set -e

          if [[ "$race_a_exit" -ne 0 || "$race_b_exit" -ne 0 || "$blocker_exit" -ne 0 ]]; then
            echo 'PROOF_CONCURRENT_SESSION_EXECUTION=FAIL'
            cat "$race_a" "$race_b" "$blocker_log"
            exit 1
          fi
          echo 'PROOF_CONCURRENT_SESSION_EXECUTION=PASS'

          accepted_count="$(cat "$race_a" "$race_b" | grep -c '^ACCEPTED$' || true)"
          replay_count="$(cat "$race_a" "$race_b" | grep -c '^REPLAY$' || true)"

          if [[ "$accepted_count" -ne 1 ]]; then
            echo 'PROOF_CONCURRENT_ACCEPTED_EXACTLY_ONE=FAIL'
            cat "$race_a" "$race_b"
            exit 1
          fi
          echo 'PROOF_CONCURRENT_ACCEPTED_EXACTLY_ONE=PASS'

          if [[ "$replay_count" -ne 1 ]]; then
            echo 'PROOF_CONCURRENT_REPLAY_EXACTLY_ONE=FAIL'
            cat "$race_a" "$race_b"
            exit 1
          fi
          echo 'PROOF_CONCURRENT_REPLAY_EXACTLY_ONE=PASS'

          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -p 54322 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -f tests/sql/tiger-synapse-proof-of-now-concurrency-verify.sql

