name: TSRF Hash Probe

on:
  push:
    branches:
      - release/tiger-jo-convergence

permissions:
  contents: read

jobs:
  hash-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Compute exact TSRF migration SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_HEAD=$(git rev-parse HEAD)"
          sha256sum \
            supabase/migrations/20260808130000_tsrf_ai_trust_fabric.sql \
            supabase/migrations/20260808131000_tsrf_ai_runtime_atomicity.sql \
            supabase/migrations/20260808132000_tsrf_owner_authorization_leases.sql
