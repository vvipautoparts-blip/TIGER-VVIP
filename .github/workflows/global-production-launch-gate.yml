name: Global Production Launch Gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  strict-global-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Evaluate ten-layer production closure authority
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { evaluateClosure } = require('./scripts/project-control/global-production-closure-gate.js');
          const manifest = JSON.parse(fs.readFileSync('./project-control/production-handover/global-production-closure.v1.json', 'utf8'));
          const result = evaluateClosure(manifest);
          console.log(JSON.stringify(result, null, 2));
          if (!result.ready) process.exit(1);
          NODE
