name: Release Workflow Hardening Proof

on:
  push:
    branches:
      - feat/release-workflow-hardening-20260809

permissions:
  contents: read

jobs:
  contract:
    name: Verify release workflow hardening contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Verify branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/release-workflow-hardening-20260809"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run hardening contract
        run: node --test tests/release-workflow-hardening.test.cjs
