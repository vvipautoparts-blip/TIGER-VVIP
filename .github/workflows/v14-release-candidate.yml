name: V14 Release Candidate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - integration/v14-global-launch-readiness-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_SHA=$SOURCE_SHA"
          echo "ACTUAL_SOURCE_SHA=$actual_sha"
          test "$actual_sha" = "$SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest
      - name: Run full quality gate
        run: bash scripts/quality-gate.sh
      - name: Run V14 release tests
        run: |
          python -m unittest -v tests/test_vvip_public_release.py
          node --test \
            tests/auth-clerk-index.test.cjs \
            tests/v14-marketplace-migration.test.cjs \
            tests/vvip-runtime-loader.test.cjs \
            tests/vvip-marketplace-repository.test.cjs \
            tests/vvip-production-marketplace.test.cjs
      - name: Build candidate artifact without production credentials
        run: |
          python tools/vvip_public_release.py \
            --source . \
            --output "$RUNNER_TEMP/vvip-candidate" \
            --mode candidate \
            --source-sha "$SOURCE_SHA"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v14-release-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/vvip-candidate
          if-no-files-found: error
          retention-days: 14
