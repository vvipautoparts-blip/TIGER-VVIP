name: SMG v1 Read-Only Proof

on:
  push:
    branches:
      - feat/srpc-v1-control-plane-20260809
    paths:
      - .github/workflows/smg-v1-proof.yml
      - tools/smg/**
      - schemas/smg/**
      - tests/smg/**
      - evidence/smg-v1/**

permissions:
  contents: read

jobs:
  smg-proof:
    name: Exact H1 sovereign merge proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact control-plane commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1

      - name: Verify control-plane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C control rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/smg-control-sha.txt"

      - name: Checkout exact approved H1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e7fb3c1e43415e5bfaee957b6ab553ae68bc139
          path: subject
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install pinned test runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify exact H1 and Phase B migration bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C subject rev-parse HEAD)" = "1e7fb3c1e43415e5bfaee957b6ab553ae68bc139"
          actual="$(sha256sum subject/supabase/migrations/20260808224500_global_launch_phase_b_marketplace_convergence.sql | awk '{print $1}')"
          test "$actual" = "9dd28d7c02c7b1a37da59b0ac8fe28df73f656d9f9a16dcd356989cc3520a8b9"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/smg-migration.sha256"

      - name: Run SMG unit and workflow contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd control
          python -m pytest tests/smg -q

      - name: Upload read-only SMG proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: smg-v1-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/smg-control-sha.txt
            ${{ runner.temp }}/smg-migration.sha256
          if-no-files-found: error
          retention-days: 30
