name: VVIP Quality Gate

on:
  pull_request:
    branches:
      - main
      - integration/v14-global-launch-readiness-20260806
  push:
    branches:
      - integration/v14-global-launch-readiness-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vvip-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt pytest

      - name: Fetch main comparison reference
        run: git fetch --no-tags --prune origin main:refs/remotes/origin/main

      - name: Run VVIP quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality-gate.sh 2>&1 | tee /tmp/vvip-quality-gate.log
          exit "${PIPESTATUS[0]}"

      - name: Upload quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vvip-quality-gate-${{ github.sha }}
          path: /tmp/vvip-quality-gate.log
          if-no-files-found: error
          retention-days: 14
