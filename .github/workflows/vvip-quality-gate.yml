name: VVIP Quality Gate

on:
  pull_request:
    branches:
      - main
      - integration/v14-global-launch-readiness-20260806
      - feat/tsrf-global-launch-proof-20260808
      - feat/tsrf-launch-evidence-plane-20260808
      - feat/lc04-production-legacy-rpc-hardening-20260808
      - feat/lc05-credential-surface-isolation-20260808
      - feat/documentation-sovereign-knowledge-plane-20260808
      - feat/lean-global-cost-governor-20260808
      - feat/lean-global-static-cdn-20260808
      - fix/tsrf-staging-workflow-context-20260808
      - docs/federated-identity-sovereignty-20260808
      - feat/identity-01-fail-closed-legacy-linking-20260808
      - feat/lean-global-request-sovereignty-20260808
      - feat/lean-global-cover-media-budget-20260808
  push:
    branches:
      - integration/v14-global-launch-readiness-20260806
      - feat/tsrf-launch-evidence-plane-20260808
      - feat/lc04-production-legacy-rpc-hardening-20260808
      - feat/lc05-credential-surface-isolation-20260808
      - feat/lc06-rls-performance-hardening-20260808
      - feat/lean-global-cost-governor-20260808
      - feat/lean-global-static-cdn-20260808
      - fix/tsrf-staging-workflow-context-20260808
      - docs/federated-identity-sovereignty-20260808
      - feat/identity-01-fail-closed-legacy-linking-20260808
      - feat/lean-global-request-sovereignty-20260808
      - feat/lean-global-cover-media-budget-20260808
      - docs/vvip-tiger-continuity-checkpoint-20260808-2340
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vvip-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_SHA=$SOURCE_SHA"
          echo "ACTUAL_SOURCE_SHA=$actual_sha"
          test "$actual_sha" = "$SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest

      - name: Fetch main comparison reference
        run: git fetch --no-tags --prune origin main:refs/remotes/origin/main

      - name: Run VVIP quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality-gate.sh 2>&1 | tee /tmp/vvip-quality-gate.log
          exit "${PIPESTATUS[0]}"

      - name: Upload quality gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vvip-quality-gate-${{ env.SOURCE_SHA }}
          path: /tmp/vvip-quality-gate.log
          if-no-files-found: error
          retention-days: 14
