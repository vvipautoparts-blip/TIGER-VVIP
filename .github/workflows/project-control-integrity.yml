name: Project Control Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - 'project-control/**'
      - 'docs/global/**'
      - 'docs/superpowers/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'project-control/**'
      - 'docs/global/**'
      - 'docs/superpowers/**'
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 -uall)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Run project-control tests
        run: node --test project-control/tests/project_control_integrity.test.mjs
      - name: Validate canonical sources and counts
        run: node project-control/scripts/validate_project_control.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify no secret-like production keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(sk_live_[A-Za-z0-9_]{16,}|sb_secret_[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
            project-control docs/global supabase/migrations; then
            echo "Secret-like production material detected."
            exit 1
          fi
