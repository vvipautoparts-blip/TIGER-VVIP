name: Project Control Integrity

on:
  pull_request:
    paths:
      - 'project-control/**'
      - 'docs/global/**'
      - 'docs/owner-control/**'
      - 'docs/superpowers/**'
      - 'supabase/migrations/**'
      - '.github/workflows/project-control-integrity.yml'
  push:
    branches:
      - main
      - integration/v14-global-launch-readiness-20260806
    paths:
      - 'project-control/**'
      - 'docs/global/**'
      - 'docs/owner-control/**'
      - 'docs/superpowers/**'
      - 'supabase/migrations/**'
      - '.github/workflows/project-control-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Run project-control tests
        run: node --test project-control/tests/*.test.mjs
      - name: Validate canonical sources and counts
        run: node project-control/scripts/validate_project_control.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Verify no secret-like production keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(sk_live_[A-Za-z0-9_]{16,}|sb_secret_[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
            project-control docs/global docs/owner-control supabase/migrations; then
            echo "Secret-like production material detected."
            exit 1
          fi
