<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VVIP TIGER - Clerk Private Profile</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.18), transparent 35%),
        linear-gradient(135deg, #070b16 0%, #0f172a 45%, #f8fafc 45%, #eef2ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .profile-card {
      width: min(760px, 92vw);
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(218,165,32,0.35);
      border-radius: 30px;
      padding: 36px;
      box-shadow: 0 35px 100px rgba(15,23,42,0.28);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(22,163,74,0.12);
      color: #166534;
      font-weight: 800;
      border: 1px solid rgba(22,163,74,0.28);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      color: #2563eb;
      font-size: 36px;
      font-weight: 900;
    }

    .email {
      font-size: 18px;
      color: #334155;
      margin: 10px 0 24px;
    }

    .vip-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 22px;
      margin-top: 20px;
      text-align: right;
      line-height: 2;
      font-size: 17px;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, a {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      color: white;
      background: #2563eb;
    }

    button.dark {
      background: #0f172a;
    }

    .loading {
      font-size: 18px;
      font-weight: 800;
      color: #475569;
    }

    .error {
      color: #991b1b;
      font-weight: 800;
    }
  </style>

  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YWNjdXJhdGUtbXVsZS0yOC5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://accurate-mule-28.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
</head>

<body>
  <main class="profile-card" id="app">
    <div class="loading">جاري التحقق من الدخول عبر Clerk...</div>
  </main>

  <script>
    window.addEventListener("load", async function () {
      const app = document.getElementById("app");

      try {
        if (!window.Clerk) {
          throw new Error("Clerk object not found");
        }

        await window.Clerk.load();

        if (!window.Clerk.isSignedIn) {
          window.location.href = "clerk-test.html";
          return;
        }

        const user = window.Clerk.user || {};

        const email =
          user.primaryEmailAddress &&
          user.primaryEmailAddress.emailAddress
            ? user.primaryEmailAddress.emailAddress
            : "مستخدم VVIP TIGER";

        const name =
          user.fullName ||
          user.firstName ||
          "VVIP TIGER Member";

        app.innerHTML = `
          <div class="badge">Verified VIP via Clerk</div>
          <h1>VVIP TIGER LIVE PROFILE</h1>
          <div class="email">${email}</div>

          <div class="vip-box">
            <strong>الاسم:</strong> ${name}<br>
            <strong>البريد:</strong> ${email}<br>
            <strong>Account:</strong> VIP<br>
            <strong>Status:</strong> Verified VIP<br>
            <strong>Auth Layer:</strong> Clerk
          </div>

          <div class="actions">
            <a href="clerk-test.html">العودة لصفحة Clerk</a>
            <button class="dark" id="sign-out-btn">تسجيل الخروج</button>
          </div>
        `;

        document.getElementById("sign-out-btn").addEventListener("click", async function () {
          await window.Clerk.signOut();
          window.location.href = "clerk-test.html";
        });
      } catch (error) {
        console.error("Clerk profile error:", error);
        app.innerHTML = `
          <h1 class="error">تعذر تحميل بروفايل Clerk</h1>
          <p>الخطأ: ${error.message || "غير معروف"}</p>
          <div class="actions">
            <a href="clerk-test.html">العودة لصفحة Clerk</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
