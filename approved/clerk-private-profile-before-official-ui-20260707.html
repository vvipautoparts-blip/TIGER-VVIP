<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VVIP TIGER - Clerk Supabase Profile</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.18), transparent 35%),
        linear-gradient(135deg, #070b16 0%, #0f172a 45%, #f8fafc 45%, #eef2ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .profile-card {
      width: min(760px, 92vw);
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(218,165,32,0.35);
      border-radius: 30px;
      padding: 36px;
      box-shadow: 0 35px 100px rgba(15,23,42,0.28);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(22,163,74,0.12);
      color: #166534;
      font-weight: 800;
      border: 1px solid rgba(22,163,74,0.28);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      color: #2563eb;
      font-size: 34px;
      font-weight: 900;
    }

    .email {
      font-size: 18px;
      color: #334155;
      margin: 10px 0 24px;
      direction: ltr;
    }

    .vip-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 22px;
      margin-top: 20px;
      text-align: right;
      line-height: 2;
      font-size: 17px;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(37,99,235,0.08);
      color: #1e40af;
      font-weight: 800;
      line-height: 1.7;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, a {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      color: white;
      background: #2563eb;
    }

    button.dark {
      background: #0f172a;
    }

    .loading {
      font-size: 18px;
      font-weight: 800;
      color: #475569;
    }

    .error {
      color: #991b1b;
      font-weight: 800;
    }
  </style>

  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YWNjdXJhdGUtbXVsZS0yOC5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://accurate-mule-28.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="profile-card" id="app">
    <div class="loading">جاري التحقق من الدخول وربط البروفايل...</div>
  </main>

  <script>
    const VVIP_SUPABASE_URL = "https://zelcngyyvbomuzokvuxo.supabase.co";
    const VVIP_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TSoq1AaQFTo00nTZMUDugA_Z3uUON-u";

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPrimaryEmail(user) {
      return (
        user &&
        user.primaryEmailAddress &&
        user.primaryEmailAddress.emailAddress
      )
        ? user.primaryEmailAddress.emailAddress
        : "";
    }

    function getDisplayName(user) {
      return (
        user.fullName ||
        user.firstName ||
        getPrimaryEmail(user) ||
        "VVIP TIGER Member"
      );
    }

    function getAvatarUrl(user) {
      return user.imageUrl || user.profileImageUrl || "";
    }

    function createClerkSupabaseClient() {
      return window.supabase.createClient(
        VVIP_SUPABASE_URL,
        VVIP_SUPABASE_PUBLISHABLE_KEY,
        {
          async accessToken() {
            if (!window.Clerk || !window.Clerk.session) {
              return null;
            }
            return window.Clerk.session.getToken();
          }
        }
      );
    }

    async function loadOrCreateVvipProfile(client, user) {
      const clerkUserId = user.id;
      const email = getPrimaryEmail(user);
      const displayName = getDisplayName(user);
      const avatarUrl = getAvatarUrl(user);

      const existingResult = await client
        .from("vvip_clerk_profiles")
        .select("*")
        .eq("clerk_user_id", clerkUserId)
        .maybeSingle();

      if (existingResult.error) {
        throw existingResult.error;
      }

      if (existingResult.data) {
        const updateResult = await client
          .from("vvip_clerk_profiles")
          .update({
            email: email,
            display_name: displayName,
            avatar_url: avatarUrl,
            updated_at: new Date().toISOString()
          })
          .eq("clerk_user_id", clerkUserId)
          .select("*")
          .single();

        if (updateResult.error) {
          throw updateResult.error;
        }

        return {
          profile: updateResult.data,
          created: false
        };
      }

      const insertResult = await client
        .from("vvip_clerk_profiles")
        .insert({
          clerk_user_id: clerkUserId,
          email: email,
          display_name: displayName,
          avatar_url: avatarUrl,
          account_status: "active"
        })
        .select("*")
        .single();

      if (insertResult.error) {
        throw insertResult.error;
      }

      return {
        profile: insertResult.data,
        created: true
      };
    }

    function renderProfile(user, profile, created) {
      const email = profile.email || getPrimaryEmail(user) || "لا يوجد بريد";
      const name = profile.display_name || getDisplayName(user);
      const status = profile.account_status || "active";
      const trialEnd = profile.trial_end_at
        ? new Date(profile.trial_end_at).toLocaleDateString("ar-JO")
        : "غير محدد";

      document.getElementById("app").innerHTML = `
        <div class="badge">تم الربط مع Supabase عبر Clerk</div>
        <h1>VVIP TIGER LIVE PROFILE</h1>
        <div class="email">${escapeHtml(email)}</div>

        <div class="vip-box">
          <strong>الاسم:</strong> ${escapeHtml(name)}<br>
          <strong>البريد:</strong> ${escapeHtml(email)}<br>
          <strong>حالة الحساب:</strong> ${escapeHtml(status)}<br>
          <strong>نهاية الفترة المجانية:</strong> ${escapeHtml(trialEnd)}<br>
          <strong>جدول البيانات:</strong> vvip_clerk_profiles<br>
          <strong>Auth Layer:</strong> Clerk + Supabase RLS
        </div>

        <div class="status">
          ${created ? "تم إنشاء بروفايل جديد وربطه بـ Clerk." : "تم تحميل البروفايل وربطه بـ Clerk."}
        </div>

        <div class="actions">
          <a href="index.html">العودة للدخول</a>
          <a href="public-profile.html">الصفحة العامة</a>
          <button class="dark" id="sign-out-btn">تسجيل الخروج</button>
        </div>
      `;

      document.getElementById("sign-out-btn").addEventListener("click", async function () {
        await window.Clerk.signOut();
        window.location.href = "index.html";
      });
    }

    window.addEventListener("load", async function () {
      const app = document.getElementById("app");

      try {
        if (!window.Clerk) {
          throw new Error("Clerk object not found");
        }

        if (!window.supabase) {
          throw new Error("Supabase JS object not found");
        }

        await window.Clerk.load();

        if (!window.Clerk.isSignedIn) {
          window.location.href = "index.html";
          return;
        }

        const user = window.Clerk.user || {};
        const client = createClerkSupabaseClient();
        const result = await loadOrCreateVvipProfile(client, user);

        renderProfile(user, result.profile, result.created);
      } catch (error) {
        console.error("Clerk + Supabase profile error:", error);
        app.innerHTML = `
          <h1 class="error">تعذر تحميل بروفايل VVIP TIGER</h1>
          <p>الخطأ: ${escapeHtml(error.message || "غير معروف")}</p>
          <div class="actions">
            <a href="index.html">العودة لصفحة الدخول</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
