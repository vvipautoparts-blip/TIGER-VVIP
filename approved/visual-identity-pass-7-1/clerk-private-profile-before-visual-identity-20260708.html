    const VVIP_SUPABASE_URL = "https://zelcngyyvbomuzokvuxo.supabase.co";
    const VVIP_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TSoq1AaQFTo00nTZMUDugA_Z3uUON-u";

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPrimaryEmail(user) {
      return (
        user &&
        user.primaryEmailAddress &&
        user.primaryEmailAddress.emailAddress
      )
        ? user.primaryEmailAddress.emailAddress
        : "";
    }

    function getDisplayName(user) {
      return (
        user.fullName ||
        user.firstName ||
        getPrimaryEmail(user) ||
        "VVIP TIGER Member"
      );
    }

    function getAvatarUrl(user) {
      return user.imageUrl || user.profileImageUrl || "";
    }

    function createClerkSupabaseClient() {
      return window.supabase.createClient(
        VVIP_SUPABASE_URL,
        VVIP_SUPABASE_PUBLISHABLE_KEY,
        {
          async accessToken() {
            if (!window.Clerk || !window.Clerk.session) {
              return null;
            }
            return window.Clerk.session.getToken();
          }
        }
      );
    }

    async function loadOrCreateVvipProfile(client, user) {
      const clerkUserId = user.id;
      const email = getPrimaryEmail(user);
      const displayName = getDisplayName(user);
      const avatarUrl = getAvatarUrl(user);

      const existingResult = await client
        .from("vvip_clerk_profiles")
        .select("*")
        .eq("clerk_user_id", clerkUserId)
        .maybeSingle();

      if (existingResult.error) {
        throw existingResult.error;
      }

      if (existingResult.data) {
        const updateResult = await client
          .from("vvip_clerk_profiles")
          .update({
            email: email,
            display_name: displayName,
            avatar_url: avatarUrl,
            updated_at: new Date().toISOString()
          })
          .eq("clerk_user_id", clerkUserId)
          .select("*")
          .single();

        if (updateResult.error) {
          throw updateResult.error;
        }

        return {
          profile: updateResult.data,
          created: false
        };
      }

      const insertResult = await client
        .from("vvip_clerk_profiles")
        .insert({
          clerk_user_id: clerkUserId,
          email: email,
          display_name: displayName,
          avatar_url: avatarUrl,
          account_status: "active"
        })
        .select("*")
        .single();

      if (insertResult.error) {
        throw insertResult.error;
      }

      return {
        profile: insertResult.data,
        created: true
      };
    }

                  </div>

                  <form id="tiger-care-form">
                    <div class="vvip-care-grid">
                      <div class="vvip-care-field">
                        <label for="care-type">نوع الطلب</label>
                        <select id="care-type" name="care_type">
                          <option>استفسار عضوية VIP</option>
                          <option>طلب دعم حساب</option>
                          <option>طلب تواصل إداري</option>
                          <option>طلب تصعيد رسمي</option>
                        </select>
                      </div>

                      <div class="vvip-care-field">
                        <label for="care-sector">القطاع المسؤول</label>
                        <select id="care-sector" name="care_sector">
                          <option>Tiger Care</option>
                          <option>إدارة العضويات</option>
                          <option>الدعم الفني</option>
                          <option>إدارة المنصة</option>
                        </select>
                      </div>

                      <div class="vvip-care-field">
                        <label for="care-priority">الأولوية</label>
                        <select id="care-priority" name="care_priority">
                          <option>عادي</option>
                          <option>مهم</option>
                          <option>عاجل</option>
                        </select>
                      </div>

                      <div class="vvip-care-field">
                        <label for="care-channel">طريقة الرد</label>
                        <select id="care-channel" name="care_channel">
                          <option>داخل المنصة</option>
                          <option>البريد الإلكتروني المسجل</option>
                        </select>
                      </div>

                      <div class="vvip-care-field vvip-care-field-full">
                        <label for="care-message">ملاحظات الطلب</label>
                        <textarea id="care-message" name="care_message" placeholder="اكتب تفاصيل الطلب باختصار..."></textarea>
                      </div>
                    </div>

                    <div class="vvip-care-foot">
                      <span class="vvip-care-note">سيتم تحويل الطلب لاحقًا إلى Tiger Care Dashboard مع SLA وتتبع الحالة.</span>
                      <button class="vvip-btn vvip-btn-primary" type="submit">إرسال طلب تواصل رسمي</button>
                    </div>

                    <div id="tiger-care-message" class="vvip-care-message" role="status" aria-live="polite">
                      تم استلام طلبك، وسيتم التواصل معك خلال 24 ساعة.
                    </div>
                  </form>
                </section>

                <div class="vvip-alert">
                  ${
                    created
                      ? "تم إنشاء بروفايل جديد وربطه مع Clerk و Supabase بنجاح."
                      : "تم تحميل البروفايل الخاص وربطه مع Clerk و Supabase بنجاح."
                  }
                </div>

                <div class="vvip-actions">
                  <a class="vvip-btn vvip-btn-primary" href="public-profile.html">متابعة إلى الصفحة العامة</a>
                  <a class="vvip-btn vvip-btn-dark" href="index.html">العودة إلى الدخول</a>
                  <button class="vvip-btn vvip-btn-soft" id="sign-out-btn" type="button">تسجيل الخروج</button>
                </div>
              </div>

              <aside class="vvip-info-card">
                <h2 class="vvip-section-title">مسار الأمان الحالي</h2>

                <div class="vvip-flow">
                  <div class="vvip-flow-item">
                    <span>تسجيل الدخول</span>
                    <small>Clerk</small>
                  </div>

                  <div class="vvip-flow-item">
                    <span>صلاحيات القراءة والكتابة</span>
                    <small>Supabase RLS</small>
                  </div>

                  <div class="vvip-flow-item">
                    <span>جدول البيانات</span>
                    <small>vvip_clerk_profiles</small>
                  </div>

                  <div class="vvip-flow-item">
                    <span>حالة الصفحة</span>
                    <small>Official Mobile First</small>
                  </div>
                </div>
              </aside>
            </div>
          </section>

          <p class="vvip-note">
            هذه الصفحة أصبحت المسار الرسمي الأول للبروفايل الخاص، وسيتم تطويرها تدريجيًا دون كسر المسار القديم.
          </p>
        </div>
      `;

      const tigerCareForm = document.getElementById("tiger-care-form");
      const tigerCareMessage = document.getElementById("tiger-care-message");

      if (tigerCareForm && tigerCareMessage) {
        tigerCareForm.addEventListener("submit", function (event) {
          event.preventDefault();
          tigerCareMessage.classList.add("is-visible");
          tigerCareMessage.textContent = "تم استلام طلبك، وسيتم التواصل معك خلال 24 ساعة.";
        });
      }

      const signOutBtn = document.getElementById("sign-out-btn");
      if (signOutBtn) {
        signOutBtn.addEventListener("click", async function () {
          await window.Clerk.signOut();
          window.location.href = "index.html";
        });
      }
    }

    window.addEventListener("load", async function () {
      const app = document.getElementById("app");

      try {
        if (!window.Clerk) {
          throw new Error("Clerk object not found");
        }

        if (!window.supabase) {
          throw new Error("Supabase JS object not found");
        }

        await window.Clerk.load();

        if (!window.Clerk.isSignedIn) {
          window.location.href = "index.html";
          return;
        }

        const user = window.Clerk.user || {};
        const client = createClerkSupabaseClient();
        const result = await loadOrCreateVvipProfile(client, user);

        renderProfile(user, result.profile, result.created);
      } catch (error) {
        console.error("Clerk + Supabase profile error:", error);
        app.innerHTML = `
          <h1 class="error">تعذر تحميل بروفايل VVIP TIGER</h1>
          <p>الخطأ: ${escapeHtml(error.message || "غير معروف")}</p>
          <div class="actions">
            <a href="index.html">العودة لصفحة الدخول</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
