<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VVIP TIGER - Private Profile</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/vvip-app-shell.css?v=20260711-p02" />
  <style>
    body {
      margin: 0;
      font-family: "Cairo", system-ui, sans-serif;
      color: #050505;
      background: #f0f2f5;
    }

    .private-wrap {
      width: min(980px, calc(100% - 20px));
      margin: 12px auto;
      display: grid;
      gap: 12px;
    }

    .card {
      border: 1px solid #ced0d4;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(5, 5, 5, 0.05);
      overflow: hidden;
    }

    .cover {
      height: 210px;
      background: linear-gradient(130deg, #0b1f3a 0%, #1877f2 70%, #c7dcff 100%);
      position: relative;
    }

    .cover-edit {
      position: absolute;
      inset-inline-start: 12px;
      bottom: 12px;
    }

    .avatar-row {
      padding: 0 14px 14px;
      margin-top: -46px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: end;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 999px;
      border: 4px solid #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #ffffff;
      background: #0b1f3a;
      box-shadow: 0 8px 18px rgba(5, 5, 5, 0.15);
      position: relative;
    }

    .avatar-edit {
      position: absolute;
      bottom: 0;
      inset-inline-end: -3px;
    }

    .profile-main h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .profile-main p {
      margin: 4px 0 0;
      color: #65676b;
      line-height: 1.6;
    }

    .actions {
      padding: 0 14px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid transparent;
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: #1877f2;
      color: #fff;
      border-color: #166fe5;
    }

    .btn-secondary {
      background: #e4e6eb;
      color: #050505;
      border-color: #ced0d4;
    }

    .tabs {
      padding: 0 14px 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .tab {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #ced0d4;
      border-radius: 999px;
      background: #ffffff;
      color: #050505;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      font-weight: 700;
    }

    .tab.active {
      background: #e7f3ff;
      color: #0866ff;
      border-color: #b7d3ff;
    }

    .content-card {
      padding: 14px;
      color: #65676b;
      line-height: 1.8;
      text-align: center;
    }

    .status {
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ced0d4;
      background: #ffffff;
      padding: 10px 12px;
      color: #65676b;
    }

    @media (max-width: 640px) {
      .cover {
        height: 160px;
      }

      .avatar {
        width: 84px;
        height: 84px;
      }
    }
  </style>
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YWNjdXJhdGUtbXVsZS0yOC5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://accurate-mule-28.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
</head>
<body>
  <main class="private-wrap" aria-label="Private Profile">
    <section class="card">
      <div class="cover">
        <button class="btn btn-secondary cover-edit" type="button" data-vvip-edit="cover">تعديل الغلاف</button>
      </div>

      <div class="avatar-row">
        <div class="avatar" id="private-avatar" aria-hidden="true">
          VT
          <button class="btn btn-secondary avatar-edit" type="button" data-vvip-edit="avatar">تعديل</button>
        </div>
        <div class="profile-main">
          <h1 id="private-name">VVIP TIGER Member</h1>
          <p id="private-username">@vvip.member</p>
          <p>هذا العرض خاص بإدارة الحساب ولا يظهر للآخرين.</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="button">تعديل الملف</button>
        <a class="btn btn-secondary" href="public-profile.html">عرض الملف العام</a>
      </div>

      <div class="tabs" role="tablist" aria-label="Private profile tabs">
        <span class="tab active" role="tab" aria-current="page">الكل</span>
        <span class="tab" role="tab">الإعلانات</span>
        <span class="tab" role="tab">الصور</span>
        <span class="tab" role="tab">التفاصيل</span>
        <span class="tab" role="tab">المحفوظات</span>
      </div>
    </section>

    <section class="card content-card" aria-label="Private content state">
      <p>لا توجد بيانات منشورات متاحة في هذه المعاينة حاليًا.</p>
      <p>معاينة تصميمية - بدون حفظ أو رفع أو تعديل حقيقي.</p>
      <div id="private-status" class="status" role="status" aria-live="polite">جاري التحقق من الدخول وربط البروفايل...</div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      function initials(name) {
        var text = String(name || "").trim();
        if (!text) return "VT";
        var parts = text.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
      }

      function setStatus(text) {
        var el = document.getElementById("private-status");
        if (el) el.textContent = text;
      }

      async function loadPrivateProfile() {
        try {
          if (!window.Clerk) {
            setStatus("تعذر تحميل خدمة الدخول. حاول لاحقًا.");
            return;
          }

          await window.Clerk.load();
          var user = window.Clerk.user;
          if (!user) {
            window.location.replace("index.html");
            return;
          }

          var fullName = user.fullName || user.firstName || "VVIP TIGER Member";
          var preferred = user.username || (user.firstName ? user.firstName.toLowerCase() : "vvip.member");

          var nameEl = document.getElementById("private-name");
          var usernameEl = document.getElementById("private-username");
          var avatarEl = document.getElementById("private-avatar");

          if (nameEl) nameEl.textContent = fullName;
          if (usernameEl) usernameEl.textContent = "@" + preferred.replace(/\s+/g, ".");
          if (avatarEl) {
            avatarEl.firstChild.nodeValue = initials(fullName);
          }

          setStatus("تم التحقق من الدخول. إعدادات الحساب قيد التوسع ضمن المراحل القادمة.");
        } catch (_) {
          setStatus("تعذر إكمال التحقق الآن. أعد المحاولة.");
        }
      }

      document.addEventListener("click", function (event) {
        var btn = event.target.closest("[data-vvip-edit]");
        if (!btn) return;
        event.preventDefault();
        setStatus("هذه الميزة قيد التجهيز وستتوفر ضمن المرحلة المخصصة.");
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadPrivateProfile);
      } else {
        loadPrivateProfile();
      }
    })();
  </script>
  <script src="scripts/vvip-route-map.js?v=20260711-p02" defer></script>
  <script src="scripts/vvip-app-shell.js?v=20260711-p02" defer></script>
</body>
</html>
