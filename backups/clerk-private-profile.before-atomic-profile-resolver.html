  <script>
    const VVIP_SUPABASE_URL = "https://zelcngyyvbomuzokvuxo.supabase.co";
    const VVIP_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TSoq1AaQFTo00nTZMUDugA_Z3uUON-u";

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPrimaryEmail(user) {
      return (
        user &&
        user.primaryEmailAddress &&
        user.primaryEmailAddress.emailAddress
      )
        ? user.primaryEmailAddress.emailAddress
        : "";
    }

    function getDisplayName(user) {
      return (
        user.fullName ||
        user.firstName ||
        getPrimaryEmail(user) ||
        "VVIP TIGER Member"
      );
    }

    function getAvatarUrl(user) {
      return user.imageUrl || user.profileImageUrl || "";
    }

    async function waitForClerkSession() {
      const retryDelays = [250, 500, 900, 1400];

      for (let index = 0; index < retryDelays.length; index += 1) {
        try {
          if (window.Clerk && typeof window.Clerk.load === "function") {
            await window.Clerk.load();
          }

          const user = window.Clerk && window.Clerk.user ? window.Clerk.user : null;
          const session = window.Clerk && window.Clerk.session ? window.Clerk.session : null;

          if (user && session) {
            return {
              ok: true,
              status: "ready",
              user: user,
              session: session
            };
          }
        } catch (error) {
          // Keep retrying silently; the UI will handle the fallback state.
        }

        if (index < retryDelays.length - 1) {
          await sleep(retryDelays[index]);
        }
      }

      const user = window.Clerk && window.Clerk.user ? window.Clerk.user : null;
      const session = window.Clerk && window.Clerk.session ? window.Clerk.session : null;

      return {
        ok: false,
        status: user ? "session_missing" : "auth_missing",
        user: user,
        session: session
      };
    }

    async function getClerkSupabaseAccessToken() {
      const sessionState = await waitForClerkSession();

      if (!sessionState.ok || !sessionState.session || typeof sessionState.session.getToken !== "function") {
        console.log("VVIP TIGER Clerk token available: false");
        return null;
      }

      try {
        const token = await sessionState.session.getToken();
        console.log("VVIP TIGER Clerk token available: " + Boolean(token));
        return token || null;
      } catch (error) {
        console.log("VVIP TIGER Clerk token available: false");
        return null;
      }
    }

    function createClerkSupabaseClient(clerkToken) {
      const clientOptions = {};

      if (clerkToken) {
        clientOptions.accessToken = async function () {
          return clerkToken;
        };

        clientOptions.global = {
          headers: {
            Authorization: "Bearer " + clerkToken
          }
        };
      }

      return window.supabase.createClient(
        VVIP_SUPABASE_URL,
        VVIP_SUPABASE_PUBLISHABLE_KEY,
        clientOptions
      );
    }

    async function assertSupabaseAuthReady() {
      const sessionState = await waitForClerkSession();

      if (!sessionState.ok) {
        return {
          ok: false,
          status: sessionState.status,
          user: sessionState.user || null,
          session: sessionState.session || null,
          token: null,
          client: null
        };
      }

      const token = await getClerkSupabaseAccessToken();

      if (!token) {
        return {
          ok: false,
          status: "session_missing",
          user: sessionState.user,
          session: sessionState.session,
          token: null,
          client: null
        };
      }

      return {
        ok: true,
        status: "ready",
        user: sessionState.user,
        session: sessionState.session,
        token: token,
        client: createClerkSupabaseClient(token)
      };
    }

    async function getActiveProfileClient() {
      const authState = await assertSupabaseAuthReady();

      return {
        authState: authState,
        client: authState.client || null
      };
    }

    function updateProfileState(state, details) {
      window.__vvipTigerLastProfileState = Object.assign(
        {
          state: state,
          timestamp: new Date().toISOString()
        },
        details || {}
      );
    }

    window.__VVIP_TIGER_PROFILE_DEBUG__ = function () {
      return {
        clerkLoaded: Boolean(window.Clerk),
        hasUser: Boolean(window.Clerk && window.Clerk.user),
        hasSession: Boolean(window.Clerk && window.Clerk.session),
        lastProfileState: window.__vvipTigerLastProfileState || null
      };
    };

    const LAST_PROFILE_SNAPSHOT_KEY = "vvip_tiger_last_profile_snapshot";
    let profileResolutionInProgress = false;

    function normalizeEmail(value) {
      const normalized = String(value || "").trim().toLowerCase();
      return normalized || null;
    }

    function sleep(ms) {
      return new Promise(function (resolve) {
        window.setTimeout(resolve, ms);
      });
    }

    function isDuplicateProfileEmailError(error) {
      const message = String(error && error.message ? error.message : "").toLowerCase();
      return (
        String(error && error.code ? error.code : "") === "23505" ||
        message.indexOf("profiles_email_unique") !== -1 ||
        message.indexOf("duplicate key") !== -1
      );
    }

    function classifyProfileError(error) {
      if (isDuplicateProfileEmailError(error)) {
        return "duplicate_email";
      }

      const code = String(error && error.code ? error.code : "").toLowerCase();
      const message = String(error && error.message ? error.message : "").toLowerCase();
      const status = Number(error && error.status ? error.status : 0);

      if (
        code === "auth_missing" ||
        status === 401 ||
        status === 403 ||
        code === "401" ||
        code === "403" ||
        message.indexOf("not authenticated") !== -1 ||
        message.indexOf("authentication") !== -1 ||
        message.indexOf("clerk") !== -1 ||
        message.indexOf("row level security") !== -1 ||
        message.indexOf("rls") !== -1 ||
        message.indexOf("permission denied") !== -1 ||
        message.indexOf("jwt") !== -1
      ) {
        return "auth_or_rls";
      }

      if (
        code === "pgrst116" ||
        message.indexOf("not found") !== -1 ||
        message.indexOf("no rows") !== -1 ||
        message.indexOf("maybe single") !== -1
      ) {
        return "profile_not_found";
      }

      if (
        code.indexOf("fetch") !== -1 ||
        code.indexOf("network") !== -1 ||
        message.indexOf("network") !== -1 ||
        message.indexOf("timeout") !== -1 ||
        message.indexOf("supabase") !== -1
      ) {
        return "network_or_supabase";
      }

      return "unknown";
    }

    async function getSafeClerkIdentity() {
      const sessionState = await waitForClerkSession();
      const user = sessionState.user || null;
      const clerkUserId = user && user.id ? String(user.id) : null;
      const email = normalizeEmail(
        user && user.primaryEmailAddress && user.primaryEmailAddress.emailAddress
      );

      return {
        ok: Boolean(sessionState.ok && clerkUserId),
        status: sessionState.ok && clerkUserId ? "ready" : sessionState.status,
        clerkUserId: clerkUserId,
        email: email,
        user: user,
        session: sessionState.session || null
      };
    }

    function buildSafeProfilePayload(clerkUser) {
      if (!clerkUser || !clerkUser.id) {
        return null;
      }

      const clerkUserId = String(clerkUser.id);
      const email = normalizeEmail(getPrimaryEmail(clerkUser));
      const displayName = getDisplayName(clerkUser);
      const avatarUrl = getAvatarUrl(clerkUser);
      const trialStartAt = new Date();
      const trialEndAt = new Date(trialStartAt);

      trialEndAt.setMonth(trialEndAt.getMonth() + 4);

      // Official runtime source remains public.profiles via clerk_user_id.
      return Object.fromEntries(
        Object.entries({
          clerk_user_id: clerkUserId,

    async function loadProfileByClerkId(client, clerkUserId, authState) {
      updateProfileState("loadProfileByClerkId", {
        clerkUserId: clerkUserId,
        authState: authState ? authState.status : null
      });

      if (!authState || authState.ok !== true || !client) {
        return {
          profile: null,
          error: null,
          status: "auth_or_rls"
        };
      }

      const result = await client
        .from("profiles")
        .select("*")
        .eq("clerk_user_id", clerkUserId)
        .maybeSingle();

      if (result.error) {
        const classified = classifyProfileError(result.error);
        return {
          profile: null,
          error: result.error,
          status: classified
        };
      }

      if (result.data) {
        return {
          profile: result.data,
          error: null,
          status: "found"
        };
      }

      return {
        profile: null,
        error: null,
        status: "profile_not_found"
      };
    }

    async function createProfileSafely(client, payload, authState) {
      updateProfileState("createProfileSafely", {
        authState: authState ? authState.status : null
      });

      if (!authState || authState.ok !== true || !client) {
        return {
          profile: null,
          error: null,
          status: "auth_or_rls"
        };
      }

      const result = await client
        .from("profiles")
        .insert(payload)
        .select("*")
        .maybeSingle();

      if (result.error) {
        return {
          profile: null,
          error: result.error,
          status: isDuplicateProfileEmailError(result.error)
            ? "duplicate_email"
            : classifyProfileError(result.error)
        };
      }

      return {
        profile: result.data || null,
        error: null,
        status: result.data ? "created" : "profile_not_found"
      };
    }

      if (!value) {

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "";

      return new Intl.DateTimeFormat("ar-JO", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    async function recoverDuplicateEmailProfile(context) {
      console.log("VVIP TIGER duplicate email recovery started");

      const client = context.client;
      const clerkUserId = context.clerkUserId;
      const normalizedEmail = normalizeEmail(context.email);
      const authState = context.authState || null;
      const retryDelays = [300, 700, 1200];

      updateProfileState("recoverDuplicateEmailProfile", {
        clerkUserId: clerkUserId,
        authState: authState ? authState.status : null
      });

      if (!authState || authState.ok !== true || !client) {
        return {
          profile: null,
          status: "auth_or_rls"
        };
      }

      for (let index = 0; index < retryDelays.length; index += 1) {
        await sleep(retryDelays[index]);
        const retryResult = await loadProfileByClerkId(client, clerkUserId, authState);

        if (retryResult.profile) {
          console.log("VVIP TIGER profile recovery success");
          return {
            profile: retryResult.profile,
            status: "recovered"
          };
        }
      }

      if (normalizedEmail) {
        try {
          const updateResult = await client
            .from("profiles")
            .update({
              clerk_user_id: clerkUserId,
              updated_at: new Date().toISOString()
            })
            .eq("email", normalizedEmail)
            .or("clerk_user_id.is.null,clerk_user_id.eq." + clerkUserId)
            .select("*")
            .maybeSingle();

          if (updateResult && updateResult.data) {
            console.log("VVIP TIGER profile recovery success");
            return {
              profile: updateResult.data,
              status: "recovered"
            };
          }

          if (updateResult && updateResult.error && classifyProfileError(updateResult.error) === "auth_or_rls") {
            return {
              profile: null,
              status: "auth_or_rls"
            };
          }
        } catch (updateError) {
          if (classifyProfileError(updateError) === "auth_or_rls") {
            return {
              profile: null,
              status: "auth_or_rls"
            };
          }
        }
      }

      const finalRetry = await loadProfileByClerkId(client, clerkUserId, authState);
      if (finalRetry.profile) {
        console.log("VVIP TIGER profile recovery success");
        return {
          profile: finalRetry.profile,
          status: "recovered"
        };
      }

      return {
        profile: null,
        status: "recovery_failed"
      };
    }

    async function resolveProfileSelfHealing(clerkUser) {
      if (profileResolutionInProgress) {
        return;
      }

      profileResolutionInProgress = true;

      try {
        const authBundle = await getActiveProfileClient();
        const authState = authBundle.authState;
        const client = authBundle.client;
        const identity = await getSafeClerkIdentity();
        const resolvedUser = clerkUser || identity.user || (window.Clerk && window.Clerk.user) || null;
        const clerkUserId = resolvedUser && resolvedUser.id ? String(resolvedUser.id) : null;
        const email = normalizeEmail(getPrimaryEmail(resolvedUser));

        if (!authState.ok || !clerkUserId || !client || !client.from) {
          renderProfileRecoveryMode({
            subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
            message: "جاري مزامنة ملف العضوية..."
          });
          return;
        }

        console.log("VVIP TIGER profile load by clerk_user_id");
        renderProfileRecoveryMode({
          subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
          message: "جاري مزامنة ملف العضوية..."
        });

        const existingResult = await loadProfileByClerkId(client, clerkUserId, authState);
        if (existingResult.profile) {
          console.log("VVIP TIGER profile recovery success");
          renderProfile(resolvedUser || identity.user, existingResult.profile, false);
          return;
        }

        if (existingResult.status === "auth_or_rls") {
          renderProfileRecoveryMode({
            subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
            message: "جاري مزامنة ملف العضوية..."
          });
          return;
        }

        const safePayload = buildSafeProfilePayload(resolvedUser || identity.user);
        if (!safePayload) {
          renderProfileRecoveryMode({
            subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
            message: "جاري مزامنة ملف العضوية..."
          });
          return;
        }

        const createResult = await createProfileSafely(client, safePayload, authState);
        if (createResult.profile) {
          console.log("VVIP TIGER profile recovery success");
          renderProfile(resolvedUser || identity.user, createResult.profile, true);
          return;
        }

        if (createResult.status === "duplicate_email") {
          const recoveryResult = await recoverDuplicateEmailProfile({
            clerkUserId: clerkUserId,
            email: email,
            client: client,
            authState: authState
          });

          if (recoveryResult.profile) {
            renderProfile(resolvedUser || identity.user, recoveryResult.profile, false);
            return;
          }

          if (recoveryResult.status === "auth_or_rls") {
            renderProfileRecoveryMode({
              subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
              message: "جاري مزامنة ملف العضوية..."
            });
            return;
          }

          renderProfileSafeMode({
            recoveryFailed: true,
            subtitle: "حسابك آمن، لكن ملف العضوية يحتاج مزامنة قصيرة.",
            message: "يرجى إعادة المحاولة بعد لحظات أو إرسال طلب عبر Tiger Care."
          });
          return;
        }

        if (createResult.status === "auth_or_rls") {
          renderProfileRecoveryMode({
            subtitle: "حسابك آمن، ويتم تجهيز ملفك الخاص.",
            message: "جاري مزامنة ملف العضوية..."
          });
          return;
        }

        renderProfileSafeMode({
          recoveryFailed: true
        });
      } catch (error) {
        renderProfileSafeMode({
          recoveryFailed: true
        });
      } finally {
        profileResolutionInProgress = false;
      }
    }

        await resolveProfileSelfHealing(window.Clerk && window.Clerk.user ? window.Clerk.user : null);
