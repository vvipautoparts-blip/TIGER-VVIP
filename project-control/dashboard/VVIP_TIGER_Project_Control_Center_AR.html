const statuses={backlog:'قائمة الانتظار',ready:'جاهزة',in_progress:'قيد التنفيذ',blocked:'متوقفة',review:'مراجعة',qa:'اختبار QA',done:'مكتملة',archived:'مؤرشفة'};
const saved=JSON.parse(localStorage.getItem('vvip-project-status')||'{}');
const tasks=baseTasks.map(t=>({...t,status:saved[t.code]||t.status}));
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
phases.forEach(p=>$('#phase').insertAdjacentHTML('beforeend',`<option value="${p.code}">${p.code} — ${esc(p.title)}</option>`));
[...new Set(tasks.map(t=>t.priority))].forEach(x=>$('#priority').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
Object.entries(statuses).forEach(([k,v])=>$('#status').insertAdjacentHTML('beforeend',`<option value="${k}">${v}</option>`));
function save(){localStorage.setItem('vvip-project-status',JSON.stringify(Object.fromEntries(tasks.map(t=>[t.code,t.status]))));}
function renderStats(){const done=tasks.filter(t=>t.status==='done').length,blocked=tasks.filter(t=>t.status==='blocked').length,p0=tasks.filter(t=>t.priority.startsWith('P0')).length;$('#stats').innerHTML=[['المراحل',phases.length],['المهام',tasks.length],['المكتملة',done],['المتوقفة',blocked],['مهام P0',p0],['الإنجاز',Math.round(done/tasks.length*100)+'%']].map(x=>`<div class="stat"><div class="num">${x[1]}</div><div>${x[0]}</div></div>`).join('');}
function filtered(){const q=$('#q').value.trim().toLowerCase(),p=$('#phase').value,pr=$('#priority').value,s=$('#status').value;return tasks.filter(t=>(!q||[t.code,t.title,t.goal,t.userBenefit,t.platformBenefit].join(' ').toLowerCase().includes(q))&&(!p||t.phase===p)&&(!pr||t.priority===pr)&&(!s||t.status===s));}
function render(){renderStats();const rows=filtered();$('#tasks').innerHTML=rows.length?rows.map(t=>`<article class="task"><div class="code">${t.code}</div><div><div class="title">${esc(t.title)}</div><div class="small">${esc(t.goal)}</div></div><div><span class="badge">${esc(t.phase)}</span><span class="badge">${esc(t.priority)}</span></div><select data-code="${t.code}">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select><button data-open="${t.code}">التفاصيل</button></article>`).join(''):'<div class="empty">لا توجد نتائج</div>';document.querySelectorAll('select[data-code]').forEach(el=>el.onchange=e=>{tasks.find(t=>t.code===e.target.dataset.code).status=e.target.value;save();render();});document.querySelectorAll('button[data-open]').forEach(b=>b.onclick=()=>openTask(b.dataset.open));}
function list(items){return `<ol>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`};
function openTask(code){const t=tasks.find(x=>x.code===code);$('#details').innerHTML=`<h2>${t.code} — ${esc(t.title)}</h2><p><b>الحالة الأساسية:</b> ${esc(t.baseline)}</p><p><b>الهدف:</b> ${esc(t.goal)}</p><p><b>فائدة المستخدم:</b> ${esc(t.userBenefit)}</p><p><b>فائدة المنصة:</b> ${esc(t.platformBenefit)}</p><p><b>المتطلبات السابقة:</b> ${esc(t.prerequisites)}</p><p><b>المسؤول:</b> ${esc(t.responsible)}</p><div class="section"><h3>عمل المبرمج</h3>${list(t.developerSteps)}</div><div class="section"><h3>ما يبنى أو يعدل</h3>${list(t.buildItems)}</div><div class="section"><h3>الأمان والخصوصية</h3>${list(t.security)}</div><div class="section"><h3>اختبارات QA</h3>${list(t.qa)}</div><div class="section"><h3>معايير القبول</h3>${Object.entries(t.acceptance).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div>`;dlg.showModal();}
['q','phase','priority','status'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),statuses:Object.fromEntries(tasks.map(t=>[t.code,t.status]))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VVIP_TIGER_project_status.json';a.click();URL.revokeObjectURL(a.href);};
$('#reset').onclick=()=>{if(confirm('إعادة جميع الحالات إلى قائمة الانتظار؟')){localStorage.removeItem('vvip-project-status');tasks.forEach(t=>t.status='backlog');render();}};render();
</script></body></html>
