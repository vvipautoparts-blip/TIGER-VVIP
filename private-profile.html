<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="2; url=clerk-private-profile.html" />
  <title>تحويل إلى البروفايل الرسمي | VVIP TIGER</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vvip-identity.css?v=20260708-7-1" />
  <link rel="stylesheet" href="styles/vvip-app-shell.css?v=20260711-p02" />

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Cairo", system-ui, sans-serif;
      background: #f0f2f5;
      color: #050505;
    }

    .redirect-card {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #ced0d4;
      box-shadow: 0 20px 48px rgba(5, 5, 5, 0.12);
    }

    .redirect-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      font-size: 30px;
      background: #0b1f3a;
      color: #ffffff;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
      color: #050505;
    }

    p {
      margin: 0 0 18px;
      color: #65676b;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      color: #ffffff;
      background: #1877f2;
      border: 1px solid #166fe5;
    }

    small {
      display: block;
      margin-top: 14px;
      color: #65676b;
    }
  </style>
  <link rel="stylesheet" href="styles/vvip-visual-trust-layer.css">
</head>
<body class="vvip-profile-ux-polish vvip-page-private-profile vvip-page-flow-journey">
  <main class="redirect-card" aria-live="polite">
    <div class="redirect-mark">VT</div>
    <h1>جاري تحويلك للبروفايل الرسمي</h1>
    <p>
      تم نقل البروفايل الخاص إلى النسخة الرسمية الجديدة المعتمدة على Clerk.
      سيتم تحويلك تلقائيًا خلال لحظات.
    </p>
    <a id="redirect-link" href="clerk-private-profile.html">فتح البروفايل الرسمي الآن</a>
    <small>VVIP TIGER</small>
  </main>

  <script>
    (function () {
      var target = "clerk-private-profile.html";
      var extra = "";

      if (window.location.search) {
        extra += window.location.search;
      }

      if (window.location.hash) {
        extra += window.location.hash;
      }

      if (extra) {
        target += extra;
      }

      var link = document.getElementById("redirect-link");
      if (link) {
        link.setAttribute("href", target);
      }

      window.setTimeout(function () {
        window.location.replace(target);
      }, 250);
    })();
  </script>
  <script src="scripts/vvip-route-map.js?v=20260710-final" defer></script>
  <script src="scripts/vvip-app-shell.js?v=20260710-final" defer></script>
</body>
</html>
