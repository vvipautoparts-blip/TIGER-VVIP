<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VVIP TIGER mock-only role-based operations console preview">
  <title>VVIP TIGER | مركز العمليات</title>
  <link rel="stylesheet" href="operations-console.css">
</head>
<body>
  <a class="skip-link" href="#main-content">تجاوز إلى المحتوى</a>
  <div class="preview-banner">معاينة محلية ببيانات تجريبية فقط. لا تمثل صلاحيات أوبيانات إنتاجية.</div>
  <section id="entry-screen" class="entry-screen" aria-labelledby="entry-title"></section>
  <div id="app" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="التنقل الرئيسي"></aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button mobile-only" aria-label="فتح القائمة" aria-expanded="false">☰</button>
        <div><p class="eyebrow">VVIP TIGER</p><h1 id="page-title">مركز العمليات</h1></div>
        <div class="topbar-actions"><button id="alerts-button" class="icon-button" aria-label="التنبيهات">🔔<span id="alert-count">4</span></button><button id="role-button" class="role-chip">تغيير دور المعاينة</button></div>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="operations-console.js"></script>
</body>
</html>
