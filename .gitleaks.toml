targetRules = ["generic-api-key"]
condition = "AND"
commits = ["413faabb778ea7ef466bfa026eed8fb640710c02"]
paths = ['''^tests/vvip-distribution-journal\.test\.cjs$''']
regexTarget = "line"
regexes = ['''idempotencyKey:\s*"idem_distribution_001"''']

[[allowlists]]
description = "Known non-secret historical Gate 5 idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["fb0a0a023f7445c143ca88e16cf638174fb2c7fc"]
paths = ['''^tests/tiger-gate5-network-chaos\.test\.mjs$''']
