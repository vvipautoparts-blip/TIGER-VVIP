<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الملف العام - VVIP TIGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/vvip-app-shell.css?v=20260710-final" />
  <style>
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      color: var(--vvip-primary-text);
      background: var(--vvip-page-background);
    }

    .profile-wrap {
      width: min(980px, calc(100% - 20px));
      margin: 12px auto;
      display: grid;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--vvip-border);
      border-radius: 12px;
      background: var(--vvip-surface);
      padding: 14px;
      box-shadow: 0 2px 8px rgba(5, 5, 5, 0.05);
    }

    .profile-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: var(--vvip-brand-navy);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .chips {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      border: 1px solid var(--vvip-border);
      border-radius: 999px;
      min-height: 36px;
      padding: 0 14px;
      background: var(--vvip-surface);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      font-weight: 700;
    }

    .placeholder {
      color: var(--vvip-secondary-text);
      text-align: center;
      padding: 20px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="profile-wrap" aria-label="Public Profile">
    <section class="card profile-head" aria-label="بيانات الحساب العامة">
      <div class="avatar" aria-hidden="true">VT</div>
      <div>
        <h1>VVIP TIGER Member</h1>
        <p>هوية عامة داخل المنصة الموحدة بدون إظهار البريد أو معلومات الدخول الخاصة.</p>
      </div>
    </section>

    <section class="card" aria-label="فلاتر القطاع">
      <div class="chips" role="tablist" aria-label="فلاتر القطاعات">
        <span class="chip">الكل</span>
        <span class="chip">السيارات والخدمات</span>
        <span class="chip">المواد والمستلزمات</span>
        <span class="chip">العقارات</span>
      </div>
    </section>

    <section class="card placeholder" aria-label="حالة المحتوى العام">
      <p>لا توجد منشورات متاحة في هذه المعاينة حاليًا.</p>
      <p>معاينة تصميمية - ليست بيانات حقيقية.</p>
    </section>
  </main>

  <script src="scripts/vvip-route-map.js?v=20260710-final" defer></script>
  <script src="scripts/vvip-app-shell.js?v=20260710-final" defer></script>
</body>
</html>
