<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f0f2f5">
  <title>تعديل الملف — VVIP TIGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/vvip-pr39-profile.css">
  <script defer src="scripts/profile/pr39-profile-contract.js"></script>
  <script defer src="scripts/profile/pr39-profile-preview.js"></script>
  <script defer src="scripts/profile/pr39-profile-editor.js"></script>
  <script defer src="scripts/vvip-identity-policy.js"></script>
  <link rel="stylesheet" href="styles/vvip-p09-account-ui-finalizer.css">
  <script defer src="scripts/vvip-p09-account-ui-finalizer.js"></script>
</head>
<body data-page="edit-profile">
  <header class="pr39-header">
    <a href="private-profile-p03.html" class="pr39-brand">VVIP TIGER</a>
    <nav class="pr39-header-actions" aria-label="روابط سريعة">
      <a href="public-profile-p05.html">الملف العام</a>
      <a href="account-settings-p05.html">الإعدادات</a>
    </nav>
  </header>

  <main class="pr39-form-layout">
    <section class="pr39-card">
      <h1>تعديل الملف الشخصي</h1>
      <p>تعديل البيانات العامة فقط. الحفظ الرسمي يحتاج ربط خدمة إدارة الحساب المعتمدة.</p>
      <p data-pr39-edit-status aria-live="polite"></p>

      <form data-pr39-edit-form>
        <fieldset>
          <legend>الهوية العامة</legend>
          <label>الاسم العام
            <input name="displayName" maxlength="120" autocomplete="name" required>
          </label>
          <label>اسم المستخدم العام
            <input name="publicUsername" maxlength="32" autocomplete="off" placeholder="username_example">
          </label>
          <label>النبذة
            <textarea name="publicBio" maxlength="220" rows="4"></textarea>
          </label>
          <label>الموقع العام
            <input name="publicLocation" maxlength="120" autocomplete="off">
          </label>
        </fieldset>

        <fieldset>
          <legend>الصور العامة</legend>
          <label>رابط الصورة الشخصية
            <input name="avatarUrl" inputmode="url" autocomplete="off" placeholder="https://">
          </label>
          <label>رابط صورة الغلاف
            <input name="coverUrl" inputmode="url" autocomplete="off" placeholder="https://">
          </label>
        </fieldset>

        <div class="pr39-actions">
          <button class="pr39-btn pr39-btn-primary" type="submit">حفظ التعديلات</button>
          <button class="pr39-btn" type="button" data-pr39-edit-cancel>إلغاء</button>
          <a class="pr39-btn" href="private-profile-p03.html">العودة لمركز الحساب</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
