AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TIGER Sovereign Constellation 2026 media build foundation. Deploy only in
  ap-northeast-2. Owns the retained KMS-encrypted ECR repository and the
  least-privilege GitHub OIDC media build role. No runtime or edge resources.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing GitHub Actions OIDC provider ARN. This stack never replaces it.
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'

  RepositoryName:
    Type: String
    Default: tiger-media-finalizer
    AllowedPattern: '^[a-z0-9]+(?:[._/-][a-z0-9]+)*$'
    MinLength: 2
    MaxLength: 256

Resources:
  MediaRepositoryKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: TIGER Media Finalizer ECR encryption authority in the Seoul Sovereign Data Cell.
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountKeyAdministration
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowEcrUseWithinThisAccount
            Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount:
                  Ref: AWS::AccountId
                kms:ViaService:
                  Fn::Sub: 'ecr.${AWS::Region}.${AWS::URLSuffix}'
      Tags:
        - Key: tiger:authority
          Value: media-build-foundation
        - Key: tiger:region-role
          Value: seoul-data-cell

  MediaRepositoryKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tiger-media-finalizer-ecr
      TargetKeyId:
        Ref: MediaRepositoryKey

  MediaFinalizerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName:
        Ref: RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey:
          Fn::GetAtt:
            - MediaRepositoryKey
            - Arn
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Retain the newest 30 untagged build remnants only","selection":{"tagStatus":"untagged","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}
      Tags:
        - Key: tiger:authority
          Value: media-build-foundation
        - Key: tiger:region-role
          Value: seoul-data-cell

  MediaBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TIGER-VVIP-GitHub-MediaBuild
      Description: Exact GitHub OIDC authority for TIGER Media Sealed Build only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GitHubMediaBuildExactIdentity
            Effect: Allow
            Principal:
              Federated:
                Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:repository_owner_id': '294954557'
                'token.actions.githubusercontent.com:repository_id': '1273805565'
                'token.actions.githubusercontent.com:environment': media-build
                'token.actions.githubusercontent.com:ref': refs/heads/main
                'token.actions.githubusercontent.com:sub': repo:vvipautoparts-blip/TIGER-VVIP:environment:media-build
      Policies:
        - PolicyName: media-build-ecr-auth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetEcrAuthorizationAndScanConfiguration
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:GetRegistryScanningConfiguration
                Resource: '*'
        - PolicyName: media-build-exact-repository
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PushReadAndScanExactMediaRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeRepositories
                Resource:
                  Fn::GetAtt:
                    - MediaFinalizerRepository
                    - Arn
      Tags:
        - Key: tiger:authority
          Value: media-build

Outputs:
  RepositoryName:
    Value:
      Ref: MediaFinalizerRepository
  RepositoryArn:
    Value:
      Fn::GetAtt:
        - MediaFinalizerRepository
        - Arn
  RepositoryUri:
    Value:
      Fn::GetAtt:
        - MediaFinalizerRepository
        - RepositoryUri
  RepositoryKmsKeyArn:
    Value:
      Fn::GetAtt:
        - MediaRepositoryKey
        - Arn
  MediaBuildRoleArn:
    Value:
      Fn::GetAtt:
        - MediaBuildRole
        - Arn
